[package]
name = "tubegrab"
version = "0.2.0"
description = "TubeGrab - YouTube video/audio downloader"
authors = ["amose"]
edition = "2021"

[lib]
name = "tubegrab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "sync", "rt-multi-thread", "time"] }
