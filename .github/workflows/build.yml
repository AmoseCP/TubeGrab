name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest # Apple Silicon
            name: macos-arm64
          - os: macos-13 # Intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch engine binaries (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-binaries.ps1

      - name: Fetch engine binaries (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/fetch-binaries.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app
        run: npm run tauri build

      - name: Make portable package (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/make-portable.ps1

      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TubeGrab-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/portable/*.zip

      - name: Upload installer (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: TubeGrab-${{ matrix.name }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
