name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "把构建产物上传到这个已存在的 release tag（如 v0.3.0）；留空则只构建不上传"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest # Apple Silicon
            name: macos-arm64
            mac_arch: arm64
            rust_target: aarch64-apple-darwin
          # GitHub 已淘汰 Intel runner（macos-13），x64 版在 arm64 上交叉编译
          - os: macos-latest
            name: macos-x64
            mac_arch: x64
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Fetch engine binaries (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-binaries.ps1

      - name: Fetch engine binaries (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/fetch-binaries.sh ${{ matrix.mac_arch }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri build

      - name: Build app (macOS)
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target ${{ matrix.rust_target }}

      - name: Make portable package (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/make-portable.ps1

      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TubeGrab-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/portable/*.zip

      - name: Upload installer (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: TubeGrab-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg

      # 发布流程是先推 tag、再手动 gh release create，
      # 因此这里等 release 出现后再把 dmg 传上去。
      - name: Upload dmg to GitHub Release (macOS)
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          for i in $(seq 1 20); do
            gh release view "$TAG" --json tagName >/dev/null 2>&1 && break
            echo "release $TAG 尚不存在，等待 60s（$i/20）"
            sleep 60
          done
          gh release upload "$TAG" src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg --clobber
